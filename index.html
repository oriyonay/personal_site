<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ori Yonay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .image-fade {
      -webkit-mask-image:
        linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
      mask-image:
        linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
      mix-blend-mode: lighten;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-emerald-500 selection:text-white">
  
  <!-- Subtle Background Blurs -->
  <div class="absolute top-[10%] left-[10%] w-[30rem] h-[30rem] bg-emerald-950/20 rounded-full mix-blend-screen filter blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[10%] right-[10%] w-[30rem] h-[30rem] bg-blue-900/20 rounded-full mix-blend-screen filter blur-[120px] pointer-events-none"></div>

    <!-- Image Section -->
    <div class="w-full md:w-1/2 flex justify-center md:justify-end">
      <div class="relative w-72 h-72 md:w-96 md:h-96">
        <img src="ori.jpg" alt="Ori Yonay" class="w-full h-full object-cover image-fade" />
      </div>
    </div>

    <!-- Text Section -->
    <div class="w-full md:w-1/2 flex flex-col justify-center text-center md:text-left space-y-8">
      <div class="space-y-3">
        <h1 class="text-6xl md:text-7xl font-extrabold tracking-tight text-white">
          Ori Yonay
        </h1>
        <h2 class="text-2xl md:text-3xl font-light tracking-wide text-slate-400">
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-400 font-medium">BrainBit</span> CEO
        </h2>
      </div>

      <div class="relative">
        <p class="text-lg md:text-xl leading-relaxed text-slate-300 font-light max-w-md mx-auto md:mx-0">
          Deep learning Ph.D student at Texas A&M. Using AI to save people time.
        </p>
      </div>

      <!-- Social Links -->
      <div class="flex justify-center md:justify-start gap-4 pt-2">
        <a href="https://sites.oriyonay.com" class="inline-flex items-center rounded-full border border-emerald-400/30 bg-emerald-400/10 px-5 py-2 text-sm font-medium uppercase tracking-[0.2em] text-emerald-300 transition hover:border-emerald-300 hover:bg-emerald-400/20 hover:text-emerald-200">
          Sites
        </a>
      </div>

          <svg class="w-5 h-5 text-slate-400 group-hover:text-blue-400 transition-colors" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
