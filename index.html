<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ori Yonay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0b0b0b;
      color: #eceae4;
      font-family: "Inter Tight", system-ui, sans-serif;
    }

    ::selection { background: #eceae4; color: #0b0b0b; }

    body {
      min-height: 100svh;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: 1fr auto;
      padding: 2.2rem 2rem 1.8rem;
    }

    .spine {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      align-self: center;
      justify-self: start;
    }

    h1 {
      font-size: clamp(1.6rem, 3.4vw, 2.35rem);
      font-weight: 400;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      line-height: 1;
    }

    figure {
      margin: 0;
      align-self: center;
      justify-self: center;
      width: min(42vw, 520px);
    }

    figure img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      -webkit-mask-image:
        linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
      mask-image:
        linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, #000 12%, #000 88%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
      mix-blend-mode: lighten;
      animation: in 1.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes in {
      from { opacity: 0; transform: scale(1.04); }
      to { opacity: 1; transform: scale(1); }
    }

    .meta {
      align-self: center;
      justify-self: end;
      max-width: 16rem;
      text-align: right;
    }

    h2 {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a7a39a;
    }

    footer {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 2rem;
      margin-top: 1.5rem;
      padding-top: 1.4rem;
      border-top: 1px solid rgba(236, 234, 228, 0.12);
    }

    footer p {
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.5;
      max-width: 28em;
      color: #b7b2a8;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      max-width: 28rem;
    }

    .word {
      color: #eceae4;
      text-decoration: none;
      font-size: 0.7rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .word:hover { opacity: 0.55; }

    nav a.icon {
      width: 2rem;
      height: 2rem;
      display: grid;
      place-items: center;
      color: #8d8880;
      transition: color 0.2s ease;
    }

    nav a.icon:hover { color: #eceae4; }
    nav svg { width: 14px; height: 14px; fill: currentColor; }

    @media (max-width: 820px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 1.5rem 1.25rem 1.5rem;
        gap: 1.5rem;
      }
      .spine {
        writing-mode: horizontal-tb;
        transform: none;
        justify-self: start;
      }
      h1 {
        letter-spacing: 0.18em;
        font-size: 1.15rem;
      }
      figure {
        width: min(78vw, 380px);
        justify-self: center;
      }
      .meta {
        justify-self: start;
        text-align: left;
      }
      footer {
        flex-direction: column;
        align-items: start;
        margin-top: 0.5rem;
      }
      nav {
        justify-content: flex-start;
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      figure img { animation: none; }
    }
  </style>
</head>
<body>
  <div class="spine">
    <h1>Ori Yonay</h1>
  </div>
  <figure>
    <img src="ori.jpg" alt="Ori Yonay">
  </figure>
  <div class="meta">
    <h2>BrainBit CEO</h2>
  </div>
